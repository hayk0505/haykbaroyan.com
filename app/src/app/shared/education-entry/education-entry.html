<div class="education-entry" [class.education-entry--last]="isLast()">
  <span class="education-entry__date">{{ dateLabel() }}</span>
  <div>
    <div class="education-entry__title">{{ title() }}</div>
    <div class="education-entry__institution">{{ institution() }}</div>
    @if (diplomas()?.length) {
      <div class="education-entry__diploma-links">
        @for (diploma of diplomas(); track diploma.url) {
          <a [href]="diploma.url" target="_blank" rel="noopener" class="education-entry__diploma-link">
            {{ diploma.label }}
            <span class="education-entry__diploma-icon">↗</span>
          </a>
        }
      </div>
    }
  </div>
</div>
